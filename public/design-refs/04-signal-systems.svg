  <text x="72" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="4" fill="#C8A184">SYS.04 — SIGNAL &amp; SYSTEMS</text>

  <text x="72" y="232" font-size="72" letter-spacing="-2" fill="#F3EFE6">I think in signals</text>
  <text x="72" y="314" font-size="72" letter-spacing="-2" fill="#F3EFE6">and systems.</text>

  <text x="72" y="386" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#A8A39A">Most developers start at the UI. I start at the loop.</text>
  <text x="72" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#A8A39A">That changes how I design databases, APIs, and products.</text>

  <!-- thesis proof -->
  <rect x="72" y="500" width="680" height="300" rx="2" fill="#0B0D0C" stroke="#F3EFE6" stroke-opacity="0.12"/>
  <text x="104" y="556" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#C8A184">THESIS</text>
  <text x="104" y="600" font-size="30" fill="#F3EFE6">Gait phase detection</text>
  <text x="104" y="640" font-size="30" fill="#A8A39A">using IMUs + neural networks.</text>
  <text x="104" y="704" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A8A39A">Real-time classification of human movement.</text>
  <text x="104" y="734" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#A8A39A">The same loop as any production system.</text>

