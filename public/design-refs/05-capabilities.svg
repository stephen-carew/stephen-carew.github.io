    <text x="520" y="468" font-size="15" fill="#A8A39A">Stripe · Plaid · TrueLayer · M-Pesa · SSE</text>
    <text x="1528" y="468" text-anchor="end" font-size="14" fill="#F3EFE6" opacity="0.85">Rent collection + live order sync in production</text>

    <!-- row 4 -->
    <rect x="72" y="496" width="1456" height="1" fill="#F3EFE6" opacity="0.12"/>
    <text x="72" y="544" font-size="13" fill="#C8A184">04</text>
