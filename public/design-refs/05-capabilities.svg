    <text x="520" y="620" font-size="15" fill="#A8A39A">Python · interactions.py · MySQL · Redis</text>
    <text x="1528" y="620" text-anchor="end" font-size="14" fill="#F3EFE6" opacity="0.85">Bots running across 50+ servers</text>

