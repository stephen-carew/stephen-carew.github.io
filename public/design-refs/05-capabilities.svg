<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1600" height="1000" fill="#0B0D0C"/>

  <text x="72" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="4" fill="#C8A184">SYS.05 — CAPABILITIES</text>
  <text x="72" y="152" font-size="60" letter-spacing="-1.5" fill="#F3EFE6">What I actually use.</text>
  <text x="72" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#A8A39A">No self-ratings. Proof by application.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- row 1 -->
    <rect x="72" y="268" width="1456" height="1" fill="#F3EFE6" opacity="0.12"/>
    <text x="72" y="316" font-size="13" fill="#C8A184">01</text>
    <text x="140" y="316" font-size="19" fill="#F3EFE6">Frontend architecture</text>
    <text x="520" y="316" font-size="15" fill="#A8A39A">React · Next.js · TypeScript · Tailwind · Framer Motion</text>
    <text x="1528" y="316" text-anchor="end" font-size="14" fill="#F3EFE6" opacity="0.85">Shipped production UI across 6 products</text>

