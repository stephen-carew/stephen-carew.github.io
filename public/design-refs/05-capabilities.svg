    <text x="140" y="392" font-size="19" fill="#F3EFE6">Backend &amp; data</text>
    <text x="520" y="392" font-size="15" fill="#A8A39A">PostgreSQL · Supabase · Prisma · Drizzle · Node · Redis</text>
    <text x="1528" y="392" text-anchor="end" font-size="14" fill="#F3EFE6" opacity="0.85">RLS, migrations, API design at product scale</text>

