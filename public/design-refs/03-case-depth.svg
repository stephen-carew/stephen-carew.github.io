<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1600" height="1000" fill="#2A3124"/>

  <!-- faint coordinate grid -->
  <g stroke="#F3EFE6" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 250 H1600 M0 500 H1600 M0 750 H1600"/>
    <path d="M400 0 V1000 M800 0 V1000 M1200 0 V1000"/>
  </g>

  <text x="72" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="4" fill="#C8A184">SYS.03 — DEPTH</text>
  <text x="72" y="150" font-size="58" letter-spacing="-1.5" fill="#F3EFE6">One system, end to end.</text>

  <!-- oversized metrics strip -->
  <text x="72" y="270" font-size="120" letter-spacing="-3" fill="#F3EFE6">110+</text>
  <text x="72" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#C8A184">SHIPPED&#160;FEATURES</text>

  <text x="472" y="270" font-size="120" letter-spacing="-3" fill="#F3EFE6">55+</text>
  <text x="472" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#C8A184">DB&#160;MIGRATIONS</text>

  <text x="872" y="270" font-size="120" letter-spacing="-3" fill="#F3EFE6">5</text>
  <text x="872" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#C8A184">BILLING&#160;TIERS</text>

  <text x="1152" y="270" font-size="120" letter-spacing="-3" fill="#F3EFE6">30+</text>
  <text x="1152" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2" fill="#C8A184">ROUTE&#160;GROUPS</text>

  <!-- decision ledger -->
  <rect x="72" y="424" width="1456" height="1" fill="#F3EFE6" opacity="0.14"/>
  <text x="72" y="482" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#F3EFE6" opacity="0.6">PROBLEM</text>
  <text x="72" y="520" font-size="28" fill="#F3EFE6">UK landlords juggle 5–10 disconnected tools.</text>
  <text x="72" y="556" font-size="28" fill="#A8A39A">Existing SaaS is US-centric — no HMO, council tax, or open banking.</text>

  <rect x="72" y="604" width="1456" height="1" fill="#F3EFE6" opacity="0.14"/>
  <text x="72" y="662" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#F3EFE6" opacity="0.6">DECISION</text>
  <text x="72" y="700" font-size="28" fill="#F3EFE6">Built the entire platform solo — database schema through UI.</text>
  <text x="72" y="736" font-size="28" fill="#A8A39A">Row-level security on every table; multi-layer feature gating.</text>

  <rect x="72" y="784" width="1456" height="1" fill="#F3EFE6" opacity="0.14"/>
  <text x="72" y="842" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2" fill="#F3EFE6" opacity="0.6">RESULT</text>
  <text x="72" y="880" font-size="28" fill="#F3EFE6">A production SaaS replacing a fragmented toolchain.</text>
  <text x="1528" y="880" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#C8A184">LIVE&#160;↗</text>
</svg>
